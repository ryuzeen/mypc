<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ryu · loadout</title>
  <meta name="description" content="PC e periféricos do ryu: RTX 4070 Super, Ryzen 7 7700X, 32 GB DDR5, monitor 240 Hz.">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="preload" href="../assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="bar">
    <span class="mark">ryu <a class="steam" href="https://steamcommunity.com/id/imryuzeen/" target="_blank" rel="noopener">Steam ↗</a></span>
    <nav class="tabs" role="tablist" aria-label="Categorias">
      <kbd class="hint" aria-hidden="true">Q</kbd>
      <button role="tab" data-tab="pc">PC</button>
      <button role="tab" data-tab="gear">Mesa</button>
      <button role="tab" data-tab="extra">Guardados</button>
      <button role="tab" data-tab="perf">Desempenho</button>
      <kbd class="hint" aria-hidden="true">E</kbd>
    </nav>
    <span class="bar-total"><span class="bar-total-label"></span> <b class="bar-total-val"></b></span>
  </header>

  <main class="screen" id="screen">
    <ol class="slots" aria-label="Itens"></ol>

    <section class="stage" aria-live="polite">
      <div class="platform" aria-hidden="true">
        <span class="ring ring-a"></span>
        <span class="ring ring-b"></span>
      </div>
      <div class="stage-media">
        <img class="stage-img is-current" src="../assets/img/gpu.webp" alt="">
        <img class="stage-img" src="../assets/img/gpu.webp" alt="" aria-hidden="true">
        <div class="stage-text" hidden></div>
      </div>
      <div class="chart" hidden></div>
    </section>

    <aside class="panel">
      <div class="panel-body"></div>
    </aside>
  </main>

  <footer class="foot">
    <span>Preços: média de anúncios no Brasil em <span data-date></span>, exceto onde diz valor pago. Fotos dos fabricantes e lojas.</span>
    <span class="keys" aria-hidden="true"><kbd>Q</kbd><kbd>E</kbd> abas · <kbd>↑</kbd><kbd>↓</kbd> itens · <kbd>G</kbd> buscar</span>
  </footer>

  <script src="../assets/data.js"></script>
  <script src="main.js"></script>
</body>
</html>
